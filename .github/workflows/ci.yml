name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pi-plugin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/pi-plugin
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/pi-plugin
        run: pnpm run typecheck

      # The suite drives the extension through a fake pi API with real timers,
      # so it needs no model and no network.
      - name: Extension tests
        working-directory: packages/pi-plugin
        run: pnpm test
